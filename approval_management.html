<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Management — Approval Settings - RVRG</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="theme.css" rel="stylesheet"><link href="typography.css" rel="stylesheet"></head>
<body><div id="appHeader"></div><div id="globalSidebar"></div><main class="main-content"><h3>Data Management — Approval Settings</h3><div id="workflowMessage" role="status" aria-live="polite"></div><div id="workflowContent" hidden><p>Only Admin can change these settings. Existing tickets keep their saved rules.</p>
<form id="settingsForm" class="card card-body mb-3">
<label class="form-label" for="threshold">Level 2 threshold (INR; values above this limit)</label><input id="threshold" type="number" min="0" step="0.01" value="3000" class="form-control mb-3" required>
<div class="form-check"><input id="total_ticket_value" type="checkbox" checked class="form-check-input"><label class="form-check-label" for="total_ticket_value">Use whole ticket value including GST (off: largest material line value)</label></div>
<div class="form-check"><input id="sequential_levels" type="checkbox" checked class="form-check-input"><label class="form-check-label" for="sequential_levels">Level 1 then Level 2 for high-value tickets (off: direct to Level 2)</label></div>
<div class="form-check mb-3"><input id="hold_missing_cost" type="checkbox" class="form-check-input"><label class="form-check-label" for="hold_missing_cost">Hold requests with missing or zero material costs</label></div>
<p class="text-warning">During testing, leave the cost hold off. Incomplete prices can understate approval value.</p><button class="btn btn-success" type="submit">Save approval settings</button></form>
<form id="assignmentForm" class="card card-body mb-3"><h5>Assign an approver</h5>
<label for="assignmentUser">Active user</label><select id="assignmentUser" class="form-select mb-2" required></select>
<label for="assignmentLevel">Approval level</label><select id="assignmentLevel" class="form-select mb-2"><option value="1">Level 1</option><option value="2">Level 2</option></select>
<label for="assignmentDepartment">Department coverage</label><select id="assignmentDepartment" class="form-select mb-2"></select>
<div class="form-check mb-2"><input id="assignmentActive" type="checkbox" checked class="form-check-input"><label for="assignmentActive" class="form-check-label">Assignment active</label></div>
<button type="submit" class="btn btn-success">Save assignment</button></form>
<h5>Current assignments</h5><div class="table-responsive"><table class="table"><thead><tr><th>User</th><th>Level</th><th>Department</th><th>Active</th></tr></thead><tbody id="assignmentRows"></tbody></table></div>
<a href="approval_workflow.html">Open approval queue</a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="secure-auth.js"></script><script src="common.js"></script><script src="navigation.js"></script><script src="approval-workflow.js"></script></body></html>
