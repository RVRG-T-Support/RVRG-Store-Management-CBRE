<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - RVRG Store Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Enterprise Theme -->
    <link rel="stylesheet" href="theme.css">

    <style>

        /* Dashboard only */

        .metric-card{
            border-left:5px solid;
            border-radius:8px;
        }

        .border-primary-left{
            border-left-color:#0d6efd;
        }

        .border-success-left{
            border-left-color:#198754;
        }

        .border-warning-left{
            border-left-color:#ffc107;
        }

        .metric-icon{
            font-size:2.5rem;
            opacity:.20;
        }

    </style>

</head>

<body>

<div id="appHeader"></div>

<div id="globalSidebar"></div>

<div class="main-content">

<div class="d-flex justify-content-between align-items-center mb-4">

    <h3 class="fw-bold mb-3" style="color:#012A2D;">
        <i class="fa-solid fa-gauge-high me-2"></i>
        Dashboard Overview
    </h4>


</div>


<!-- Metrics -->

<div class="row g-4 mb-4">

<div class="col-12 col-sm-6 col-xl-3">

<div class="card metric-card border-primary-left shadow-sm h-100">

<div class="card-body position-relative">

<h6 class="text-muted fw-bold mb-2">

Total Inventory Value

</h6>

<h3
id="dashTotalValue"
class="fw-bold mb-0"
style="color:#012A2D;">

₹0.00

</h3>

<i class="fa-solid fa-indian-rupee-sign
position-absolute
top-50
end-0
translate-middle-y
me-4
metric-icon
text-primary"></i>

</div>

</div>

</div>


<div class="col-12 col-sm-6 col-xl-3">

<div class="card metric-card border-warning-left shadow-sm h-100">

<div class="card-body position-relative">

<h6 class="text-muted fw-bold mb-2">

Pending Requests

</h6>

<h3
id="dashPendingRequests"
class="fw-bold mb-0"
style="color:#012A2D;">

0

</h3>

<i class="fa-solid fa-clock
position-absolute
top-50
end-0
translate-middle-y
me-4
metric-icon
text-warning"></i>

</div>

</div>

</div>


<div class="col-12 col-sm-6 col-xl-3">

<div class="card metric-card shadow-sm h-100"
style="border-left:5px solid #dc3545;">

<div class="card-body position-relative">

<h6 class="text-muted fw-bold mb-2">

Low Stock Items

</h6>

<h3
id="dashLowStock"
class="fw-bold mb-0"
style="color:#012A2D;">

0

</h3>

<i class="fa-solid fa-triangle-exclamation
position-absolute
top-50
end-0
translate-middle-y
me-4
metric-icon
text-danger"></i>

</div>

</div>

</div>


<div class="col-12 col-sm-6 col-xl-3">

<div class="card metric-card border-success-left shadow-sm h-100">

<div class="card-body position-relative">

<h6 class="text-muted fw-bold mb-2">

Active Items

</h6>

<h3
id="dashActiveItems"
class="fw-bold mb-0"
style="color:#012A2D;">

0

</h3>

<i class="fa-solid fa-box-open
position-absolute
top-50
end-0
translate-middle-y
me-4
metric-icon
text-success"></i>

</div>

</div>

</div>

</div>


<!-- Tables -->

<div class="row g-4">

<div class="col-12 col-lg-7">

<div class="card shadow-sm border-0 h-100">

<div class="card-header
bg-white
border-bottom-0
pt-3
pb-2
d-flex
justify-content-between
align-items-center">

<h6 class="fw-bold mb-0">

Recent Material Requests

</h6>

<a
href="material_request.html"
class="btn btn-sm btn-link text-decoration-none">

View All

</a>

</div>

<div class="card-body p-0">

<div class="table-responsive">

<table class="table table-hover align-middle mb-0 text-center">

<thead class="table-light">

<tr>

<th>Complaint Number / Ticket No</th>

<th>Requested By</th>

<th>Approved By</th>

<th>Department</th>

<th>Status</th>

</tr>

</thead>

<tbody id="dashRecentRequests">

<tr>

<td colspan="5"
class="text-center text-muted py-4">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>
<div class="col-12 col-lg-5">

    <div class="card shadow-sm border-0 h-100">

        <div class="card-header bg-white pt-3 pb-2 border-bottom-0 d-flex justify-content-between align-items-center">

            <h6 class="fw-bold mb-0">
                Low Stock Alerts
            </h6>

            <button
                id="btnRefreshStock"
                class="btn btn-sm btn-link text-decoration-none">
                Refresh
            </button>

        </div>

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0 text-center">

                    <thead class="table-light">

                        <tr>
                            <th>Material</th>
                            <th>Dept</th>
                            <th>Stock</th>
                            <th>Status</th>
                        </tr>

                    </thead>

                    <tbody id="dashLowStockTable">

                        <tr>

                            <td colspan="4"
                                class="text-center text-muted py-4">

                                Loading alerts...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</div>

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Application -->
<script src="config.js"></script>
<script src="common.js"></script>
<script src="navigation.js"></script>
<script src="dashboard.js"></script>

</body>
</html>
