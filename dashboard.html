<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - RVRG Store Management</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    
    <style>
        /* Custom styling for Sidebar layout */
        body {

            <div id="appHeader"></div>

            <div id="globalSidebar"></div>

            <div class="main-content">
            
            background-color: #f4f6f9;
            overflow-x: hidden;
        }
        .sidebar {
            min-height: 100vh;
            background-color: #ffffff;
            border-right: 1px solid #dee2e6;
        }
        .sidebar .nav-link {
            color: #495057;
            color:#012A2D;
            font-weight: 500;
            padding: 10px 20px;
            margin-bottom: 5px;
            border-radius: 5px;
        }
        .sidebar .nav-link:hover{
    background:#E8F5F2;
    color:#012A2D;
}

.sidebar .nav-link.active{
    background:#E8F5F2;
    color:#012A2D;
    border-left:4px solid #17E88F;
}
        .metric-card {
            border-left: 5px solid;
            border-radius: 8px;
        }
        .border-primary-left { border-left-color: #0d6efd; }
        .border-success-left { border-left-color: #198754; }
        .border-warning-left { border-left-color: #ffc107; }
        .border-info-left { border-left-color: #0dcaf0; }

        .metric-icon {
            font-size: 2.5rem;
            opacity: 0.2;
        }
    </style>
</head>
<body>

<div style="height:4px;background:#17E88F;"></div>

            <!-- MAIN CONTENT -->        
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold" style="color:#012A2D;"><i class="fa-solid fa-gauge-high me-2"></i>Dashboard Overview</h4>
                    <span class="text-muted fw-semibold" id="currentDateDisplay">Date Loading...</span>
                </div>

                <!-- Metrics Row -->
                <div class="row g-4 mb-4">
                    <!-- Total Inventory Value -->
                    <div class="col-xl-3 col-md-6">
                        <div class="card metric-card border-primary-left shadow-sm h-100">
                            <div class="card-body position-relative">
                                <h6 class="text-muted fw-bold mb-2">Total Inventory Value</h6>
                                <h3 class="mb-0 fw-bold" style="color:#012A2D;" id="dashTotalValue">₹ 0.00</h3>
                                <i class="fa-solid fa-indian-rupee-sign position-absolute top-50 end-0 translate-middle-y me-4 metric-icon text-primary"></i>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Pending Requests -->
                    <div class="col-xl-3 col-md-6">
                        <div class="card metric-card border-warning-left shadow-sm h-100">
                            <div class="card-body position-relative">
                                <h6 class="text-muted fw-bold mb-2">Pending Requests</h6>
                                <h3 class="mb-0 fw-bold" style="color:#012A2D;" id="dashPendingRequests">0</h3>
                                <i class="fa-solid fa-clock position-absolute top-50 end-0 translate-middle-y me-4 metric-icon text-warning"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Low Stock Alerts -->
                    <div class="col-xl-3 col-md-6">
                        <div class="card metric-card border-danger-left shadow-sm h-100" style="border-left-color: #dc3545;">
                            <div class="card-body position-relative">
                                <h6 class="text-muted fw-bold mb-2">Low Stock Items</h6>
                                <h3 class="mb-0 fw-bold" style="color:#012A2D;" id="dashLowStock">0</h3>
                                <i class="fa-solid fa-triangle-exclamation position-absolute top-50 end-0 translate-middle-y me-4 metric-icon text-danger"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Approved Today -->
                    <div class="col-xl-3 col-md-6">
                        <div class="card metric-card border-success-left shadow-sm h-100">
                            <div class="card-body position-relative">
                                <h6 class="text-muted fw-bold mb-2">Active Items</h6>
                                <h3 class="mb-0 fw-bold" style="color:#012A2D;" id="dashActiveItems">0</h3>
                                <i class="fa-solid fa-box-open position-absolute top-50 end-0 translate-middle-y me-4 metric-icon text-success"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tables Row -->
                <div class="row g-4">
                    
                    <!-- Recent Material Requests -->
                    <div class="col-lg-7">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-white pt-3 pb-2 border-bottom-0 d-flex justify-content-between align-items-center">
                                <h6 class="fw-bold mb-0 text-dark">Recent Material Requests</h6>
                                <a href="material_request.html" class="btn btn-sm btn-link text-decoration-none">View All</a>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0 text-center">
                                        <thead class="table-light">
    <tr>
        <th>Ticket No</th>
<th>Requested By</th>
<th>Approved By</th>
<th>Department</th>
<th>Status</th>
    </tr>
</thead>
                                        <tbody id="dashRecentRequests">
                                            <tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Low Stock Alerts -->
                    <div class="col-lg-5">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-white pt-3 pb-2 border-bottom-0 d-flex justify-content-between align-items-center">
                                <h6 class="fw-bold mb-0 text-dark">Low Stock Alerts</h6>
                                <button class="btn btn-sm btn-link text-decoration-none" id="btnRefreshStock">Refresh</button>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0 text-center">
                                        <thead class="table-light">
                                            <tr>
                                                <th>Material</th>
                                                <th>Dept</th>
                                                <th>Stock</th>
                                                <th>Status</th>
                                            </tr>
                                        </thead>
                                        <tbody id="dashLowStockTable">
                                            <tr><td colspan="5" class="text-center text-muted py-4">Loading alerts...</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</div>

<!-- Page-specific JS -->
<script src="dashboard.js"></script>
</body>
    
<div id="appHeader"></div>

<div id="globalSidebar"></div>

<div class="main-content">
</html>
