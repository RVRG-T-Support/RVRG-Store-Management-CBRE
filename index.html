<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        // Initialize client safely if not already present
        if (!window.supabaseClient) {
            window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const errorDiv = document.getElementById('loginError');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';
            btn.disabled = true;
            errorDiv.classList.add('d-none');

            const emailInput = document.getElementById('loginUsername').value.trim();
            const passwordInput = document.getElementById('loginPassword').value.trim();

            try {
                const { data, error } = await window.supabaseClient
                    .from('users_master')
                    .select('*')
                    .eq('email', emailInput)
                    .eq('password', passwordInput)
                    .eq('is_active', true)
                    .single();

                if (error || !data) throw new Error("Invalid Email or Password");

                // Save active session matching your database columns (full_name)
                localStorage.setItem('RVRG_ACTIVE_USER', JSON.stringify({
                    id: data.id,
                    name: data.full_name,
                    role: data.role
                }));

                window.location.href = 'dashboard.html';

            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.classList.remove('d-none');
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i> Secure Login';
                btn.disabled = false;
            }
        });
    </script>
