<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Correction - RVRG Store Management</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                <i class="fa-solid fa-boxes-stacked me-2"></i>RVRG Store Management
            </a>
            <div class="d-flex align-items-center text-white">
                <span class="me-3" id="userBadge"><i class="fa-solid fa-user me-1"></i> <span id="currentUserName">Development User</span></span>
                <a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-dark"><i class="fa-solid fa-scale-balanced me-2 text-warning"></i>Inventory Correction Request (ICR)</h3>
            <button class="btn btn-secondary btn-sm" id="btnRefreshTable">
                <i class="fa-solid fa-rotate-right me-1"></i>Refresh Data
            </button>
        </div>

        <div class="row">
            
            <!-- LEFT COLUMN: ICR Form -->
            <div class="col-lg-5 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-warning text-dark fw-bold">
                        <i class="fa-solid fa-file-pen me-2"></i>Raise Correction Request
                    </div>
                    <div class="card-body">
                        <form id="icrForm">
                            
                            <!-- Department Dropdown -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Department</label>
                                <select class="form-select" id="departmentSelect" required>
                                    <option value="" selected disabled>Loading departments...</option>
                                </select>
                            </div>

                            <!-- Material Selection -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Select Material</label>
                                <select class="form-select" id="materialSelect" required>
                                    <option value="" selected disabled>Select Department First</option>
                                </select>
                            </div>

                            <!-- Stock Comparison Box -->
                            <div class="p-3 mb-3 bg-light border rounded">
                                <div class="row text-center">
                                    <div class="col-6 border-end">
                                        <span class="text-muted small d-block">System Stock</span>
                                        <span class="fw-bold fs-4 text-primary" id="systemStockDisplay">-</span>
                                    </div>
                                    <div class="col-6">
                                        <span class="text-muted small d-block">Difference</span>
                                        <span class="fw-bold fs-4" id="differenceDisplay">-</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Actual Physical Stock Input -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Actual Physical Stock</label>
                                <input type="number" class="form-control border-warning shadow-sm" id="physicalStockInput" min="0" placeholder="Enter physically counted quantity" required disabled>
                                <small class="text-muted">Enter the exact amount currently present in the store.</small>
                            </div>

                            <!-- Reason / Remarks -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Reason for Discrepancy</label>
                                <textarea class="form-control" id="icrRemarks" rows="2" placeholder="e.g., Damaged item found, counting error from last audit..." required></textarea>
                            </div>

                            <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm" id="btnSubmitIcr" disabled>
                                <i class="fa-solid fa-paper-plane me-2"></i>Submit for FM Approval
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Recent ICRs Table -->
            <div class="col-lg-7">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white pt-3 pb-2 border-bottom-0">
                        <h6 class="fw-bold mb-0 text-dark">Recent Correction Requests</h6>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Ticket ID</th>
                                        <th>Material</th>
                                        <th class="text-center">System Qty</th>
                                        <th class="text-center">Physical Qty</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="recentIcrTable">
                                    <tr>
                                        <td colspan="5" class="text-center text-muted py-4">Loading requests...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="config.js"></script>
    <script src="common.js"></script>
    <!-- Logic script for this module -->
    <script src="inventory_correction.js"></script>
</body>
</html>
