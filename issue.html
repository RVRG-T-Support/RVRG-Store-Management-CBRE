<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Materials - RVRG Store Management</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* Small adjustment to make the table input fields fit neatly */
        .issue-input {
            width: 80px;
            text-align: center;
        }
        .table-vertical-middle td, .table-vertical-middle th {
            vertical-align: middle;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                <i class="fa-solid fa-boxes-stacked me-2"></i>RVRG Store Management
            </a>
            <div class="d-flex align-items-center text-white">
                <span class="me-3" id="userBadge"><i class="fa-solid fa-user me-1"></i> <span id="currentUserName">Development User</span></span>
                <a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold text-dark"><i class="fa-solid fa-right-from-bracket me-2 text-info"></i>Approved Requests (Issue Desk)</h3>
            <button class="btn btn-secondary btn-sm" id="btnRefreshIssueList">
                <i class="fa-solid fa-rotate-right me-1"></i>Refresh List
            </button>
        </div>

        <!-- Issue Table Card -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover table-vertical-middle mb-0 text-center text-nowrap">
                        <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Ticket</th>
                                <th>Location</th>
                                <th>Department</th>
                                <th>Material</th>
                                <th>Requested</th>
                                <th>Issued</th>
                                <th class="table-warning">Balance</th>
                                <th>Unit Cost</th>
                                <th>Amount</th>
                                <th class="bg-primary text-white">Issue Qty</th>
                                <th>Action</th>
                                <th class="table-info">Stock</th>
                            </tr>
                        </thead>
                        <tbody id="approvedRequestsTable">
                            <tr>
                                <td colspan="13" class="text-center text-muted py-4">Loading approved requests...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <!-- Logic script for this module -->
    <script src="issue.js"></script>
</body>
</html>
