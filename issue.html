<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Materials - RVRG Store Management</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="theme.css" rel="stylesheet">
    <link rel="stylesheet" href="typography.css">
    <link rel="stylesheet" href="ticket-layout.css?v=20261117-tickets">

    </head>
    <body class="bg-light">

    <!-- Top Navigation Bar -->
<!-- Global Header -->
<div id="appHeader"></div>

<!-- Global Sidebar -->
<div id="globalSidebar"></div>

    <div class="main-content issue-page ticket-page">

    <div class="container-fluid px-0 my-0">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold text-dark"><i class="fa-solid fa-right-from-bracket me-2 text-info"></i>Approved Requests (Issue Desk)</h3>
            <button class="btn btn-secondary btn-sm" id="btnRefreshIssueList">
                <i class="fa-solid fa-rotate-right me-1"></i>Refresh List
            </button>
        </div>

       <!-- Issue Table Card -->
<div class="card shadow-sm border-0 mb-4">
    <div class="card-body p-0">

        <div id="issueScroll0" class="table-responsive ticket-list-scroll" tabindex="0" aria-label="Approved requests scrollable table">
            <table class="approval-ticket-list" aria-label="Material request tickets">
<tbody id="approvedRequestsTable">
                    <tr>
                        <td colspan="13" class="text-center text-muted py-4">
                            Loading approved requests...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Issued History -->
<div class="card shadow-sm border-0">
    <div class="card-header bg-white fw-bold">
        <i class="fa-solid fa-clock-rotate-left me-2"></i>
        Issued History
    </div>

    <div class="card-body p-0">

        <div id="issueScroll1" class="table-responsive ticket-list-scroll" tabindex="0" aria-label="Issued history scrollable table">
            <table class="approval-ticket-list" aria-label="Material request tickets">
<tbody id="issuedHistoryTable">
                    <tr>
                        <td colspan="8" class="text-center text-muted py-4">
                            Loading issued history...
                        </td>
                    </tr>
                </tbody>

            </table>
        </div>
    </div>
</div>
    </div>
</div>

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
<script src="secure-auth.js"></script>
    <script src="common.js?v=20261113-users"></script>
<script src="sales-pricing.js?v=20261112-sales-gst-choice"></script>
    <script src="navigation.js?v=20261113-profile"></script>

<!-- Logic script for this module -->

    <script src="record-browser.js?v=20261117-tickets"></script>
<script src="ticket-view.js?v=20261117-tickets"></script>
<script src="issue.js?v=20261117-tickets"></script>
</body>
</html>
