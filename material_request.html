<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Request - RVRG Store Management</title>
    
    <!-- 1. Bootstrap 5 CSS (100% Free CDN for styling) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <style>
        /* Custom styling for Sidebar layout */
        body {
            background-color: #f4f6f9;
            overflow-x: hidden;
        }
        .sidebar {
            min-height: 100vh;
            background-color: #ffffff;
            border-right: 1px solid #dee2e6;
        }
        .sidebar .nav-link {
            color: #495057;
            font-weight: 500;
            padding: 10px 20px;
            margin-bottom: 5px;
            border-radius: 5px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: #e9ecef;
            color: #0d6efd;
        }

    <!-- Top Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold d-flex align-items-center" href="dashboard.html">

            <img src="RVRG LOGO.jpg"
                 height="45"
                 class="bg-white rounded p-1 me-2 shadow-sm">

            <span class="text-secondary mx-1 fs-4">|</span>

            <img src="cbre_green.jpg"
                 height="45"
                 class="bg-white rounded p-1 ms-2 me-3 shadow-sm">

            <div class="d-none d-sm-block">
                <span class="d-block lh-1 text-white">
                    Store Management
                </span>

                <small class="text-info fw-normal"
                       style="font-size:12px;">
                    Enterprise Edition
                </small>
            </div>

        </a>

        <div class="d-flex align-items-center">

            <span class="me-4 text-white">
                <i class="fa-solid fa-bell"></i>
            </span>

            <div class="dropdown">

                <a class="text-white text-decoration-none dropdown-toggle"
                   href="#"
                   data-bs-toggle="dropdown">

                    <i class="fa-solid fa-user-circle me-1"></i>

                    <span id="currentUserName">
                        Loading...
                    </span>

                </a>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>

                        <a class="dropdown-item"
                           href="#"
                           onclick="logout()">

                            <i class="fa-solid fa-right-from-bracket me-2 text-danger"></i>

                            Logout

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </div>
</nav>
            
            <!-- LEFT COLUMN: Material Request Form -->
            <div class="col-lg-5 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white fw-bold">
                        <i class="fa-solid fa-file-signature me-2"></i>Raise Material Request Ticket
                    </div>
                    <div class="card-body">
                        <form id="materialRequestForm">
                            
                            <!-- Ticket Type Selection -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Complaint Type</label>
                                <select class="form-select" id="ticketType" required>
                                    <option value="" selected disabled>Select Type</option>
                                    <option value="Flat / Chargeable">Flat / Chargeable</option>
                                    <option value="Common Area / Free">Common Area / Free</option>
                                </select>
                            </div>

                            <!-- Flat No / Location -->
                            <div class="mb-3" id="locationGroup">
                                <label class="form-label fw-semibold" id="locationLabel">Flat / Location Reference</label>
                                <input type="text" class="form-control" id="locationInput" placeholder="e.g., Flat 402 or Block A Lift Lobby" required>
                            </div>

                            <!-- Department Dropdown -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Department</label>
                                <select class="form-select" id="departmentSelect" required>
                                    <option value="" selected disabled>Loading departments...</option>
                                </select>
                            </div>

                            <!-- Technician Dropdown -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Technician</label>
                                <select class="form-select" id="technicianSelect" required>
                                    <option value="" selected disabled>Select Technician</option>
                                </select>
                            </div>

                            <!-- Material Selection -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Select Material</label>
                                <select class="form-select" id="materialSelect" required>
                                    <option value="" selected disabled>Select Department First</option>
                                </select>
                            </div>

                            <!-- Material Price Display (Auto-calculated) -->
                            <div class="p-3 mb-3 bg-light border rounded" id="priceDisplayBox">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="text-muted small">Item Price:</span>
                                    <span class="fw-bold text-success fs-5" id="unitPriceDisplay">₹ 0.00</span>
                                </div>
                                <small class="text-muted d-block mt-1" id="gstNote">GST info will appear here</small>
                            </div>

                            <!-- Quantity Input -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Requested Quantity</label>
                                <input type="number" class="form-control" id="requestQuantity" min="1" placeholder="Enter quantity" required>
                            </div>

                            <!-- Remarks / Reason -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Reason / Remarks</label>
                                <textarea class="form-control" id="requestRemarks" rows="2" placeholder="Describe the issue or work..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                                <i class="fa-solid fa-paper-plane me-2"></i>Submit Ticket Request
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Recent Requests Table -->
            <div class="col-lg-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-secondary text-white fw-bold d-flex justify-content-between align-items-center">
                        <span><i class="fa-solid fa-list-check me-2"></i>Recent Material Requests</span>
                        <button class="btn btn-light btn-sm text-dark" id="btnRefreshTable">
                            <i class="fa-solid fa-rotate-right me-1"></i>Refresh
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Ticket ID</th>
                                        <th>Details</th>
                                        <th>Material</th>
                                        <th>Qty</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="recentRequestsTable">
                                    <tr>
                                        <td colspan="5" class="text-center text-muted py-4">Loading requests...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- 2. Dependencies (Supabase CDN, Config, Common JS) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <!-- 3. Logic script for this module -->
    <script src="material_request.js"></script>
    
</div>

</div>

</div>  
    
</body>
</html>
