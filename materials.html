<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Material Master - RVRG Store Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="theme.css">

<style>

.page-card{
    border:none;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.section-title{
    font-size:18px;
    font-weight:600;
    color:#012A2D;
}

.form-label{
    font-weight:600;
}

.required{
    color:red;
}

.table th{
    white-space:nowrap;
}

.btn-toolbar .btn{
    margin-right:8px;
}

</style>

</head>

<body>

<div id="appHeader"></div>

<div id="globalSidebar"></div>

<div class="main-content">

<div class="container-fluid">

<div class="d-flex justify-content-between align-items-center mb-4">

<div>

<h3 class="fw-bold text-success mb-1">

<i class="fa-solid fa-boxes-stacked me-2"></i>

Material Master

</h3>

<small class="text-muted">

Create and Maintain Material Master Database

</small>

</div>

<button class="btn btn-success" id="btnRefresh">

<i class="fa-solid fa-rotate"></i>

Refresh

</button>

</div>

<div class="btn-toolbar mb-4">

<button class="btn btn-primary" id="btnNewMaterial">

<i class="fa-solid fa-plus"></i>

New Material

</button>

<button class="btn btn-outline-success" id="btnDownloadTemplate">

<i class="fa-solid fa-file-excel"></i>

Download Template

</button>

<button class="btn btn-outline-primary" id="btnImportExcel">

<i class="fa-solid fa-upload"></i>

Import Excel

</button>

<button class="btn btn-outline-secondary" id="btnExportExcel">

<i class="fa-solid fa-download"></i>

Export Excel

</button>

</div>

<div class="card page-card">

<div class="card-header bg-white">

<h5 class="section-title mb-0">

Material Information

</h5>

</div>

<div class="card-body">

<form id="materialForm">

<div class="row">

<div class="col-md-4 mb-3">

<label class="form-label">

Material Code

</label>

<div class="input-group">

<input
type="text"
id="materialCode"
class="form-control"
readonly>

<button
type="button"
class="btn btn-outline-success"
id="btnGenerateCode">

Generate

</button>

</div>

</div>

<div class="col-md-8 mb-3">

<label class="form-label">

Material Name

<span class="required">*</span>

</label>

<input
type="text"
id="materialName"
class="form-control"
placeholder="Enter Material Name">

</div>

</div>

<div class="row">

<div class="col-md-4 mb-3">

<label class="form-label">

Department

<span class="required">*</span>

</label>

<select
id="department"
class="form-select">

<option value="">

Select Department

</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Category

</label>

<input
type="text"
id="category"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Brand

</label>

<input
type="text"
id="brand"
class="form-control">

</div>

</div>

<div class="row">

<div class="col-md-4 mb-3">

<label class="form-label">

Item Type

</label>

<select
id="itemType"
class="form-select">

<option value="">Select Item Type</option>

<option>Consumable</option>

<option>Spare</option>

<option>Tool</option>

<option>Equipment</option>

<option>Chemical</option>

<option>Safety Item</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Specification

</label>

<input
type="text"
id="specification"
class="form-control"
placeholder="Example : 32A">

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Item Size

</label>

<input
type="text"
id="itemSize"
class="form-control"
placeholder="Example : 1 Inch">

</div>

</div>

<div class="row">

<div class="col-md-3 mb-3">

<label class="form-label">

Unit

<span class="required">*</span>

</label>

<select
id="unit"
class="form-select">

<option value="">Select Unit</option>

<option>Nos</option>

<option>Bag</option>

<option>Kg</option>

<option>Ltr</option>

<option>Meter</option>

<option>Roll</option>

<option>Box</option>

<option>Packet</option>

<option>Set</option>

</select>

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Minimum Stock

</label>

<input
type="number"
id="minimumStock"
class="form-control"
value="0">

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Rack Location

</label>

<input
type="text"
id="rackLocation"
class="form-control">

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Status

</label>

<select
id="status"
class="form-select">

<option value="ACTIVE">ACTIVE</option>

<option value="INACTIVE">INACTIVE</option>

</select>

</div>

</div>

<div class="row">

<div class="col-md-3 mb-3">

<label class="form-label">

Unit Cost (₹)

</label>

<input
type="number"
step="0.01"
id="unitCost"
class="form-control">

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

GST Type

</label>

<select
id="gstType"
class="form-select">

<option value="INCLUDED">Included</option>

<option value="EXCLUDED">Excluded</option>

</select>

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

GST %

</label>

<input
type="number"
id="gstPercentage"
class="form-control"
value="18">

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Material Short Name

</label>

<input
type="text"
id="materialShortName"
class="form-control"
placeholder="MCB / SW / CMT">

</div>

</div>

<div class="mb-3">

<label class="form-label">

Description

</label>

<textarea
id="description"
class="form-control"
rows="3"></textarea>

</div>

<hr>

<div class="text-end">

<button
type="button"
class="btn btn-success"
id="btnSave">

<i class="fa-solid fa-floppy-disk"></i>

Save

</button>

<button
type="button"
class="btn btn-warning"
id="btnUpdate">

<i class="fa-solid fa-pen"></i>

Update

</button>

<button
type="reset"
class="btn btn-secondary">

<i class="fa-solid fa-eraser"></i>

Clear

</button>

<button
type="button"
class="btn btn-danger"
id="btnDelete">

<i class="fa-solid fa-trash"></i>

Delete

</button>

</div>

</form>

</div>

</div>
